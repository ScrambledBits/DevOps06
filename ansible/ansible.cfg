# Configuración de Ansible para este proyecto. Ansible la toma sola cuando
# ejecutas los comandos desde esta carpeta (ansible/).

[defaults]
# El inventario que genera Terraform (terraform/ansible.tf). Con esto no hace
# falta pasar -i inventory.ini en cada comando.
inventory = inventory.ini
# Usa el Python del servidor (python3 en Ubuntu 24.04) sin imprimir el aviso de detección.
interpreter_python = auto_silent

[ssh_connection]
# Ejecuta los módulos por la misma sesión SSH en lugar de copiar archivos
# temporales al servidor. Los playbooks corren bastante más rápido.
pipelining = True
